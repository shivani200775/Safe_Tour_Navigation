<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Safe Tour Navigation</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>


</head>

<body>

    <section class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Join Safe Tour Navigation</p>

            <form id="registerForm">

                <label>Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>

                <label>Email Address</label>
                <input type="email" id="registerEmail" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create password" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                <button type="submit">Register</button>

            </form>

            <p>Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html">Back to Home</a>

        </div>

    </section>

</body>

</html>
